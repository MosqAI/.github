name: Feature / task
description: A unit of work small enough for one PR
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Heartbeat stored with device_id and timestamp\n- [ ] Test covers timeout"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
